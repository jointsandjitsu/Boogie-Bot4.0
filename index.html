
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boogie Bot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-widget">
    <div class="chat-header">Boogie Bot 🤖</div>
    <div class="chat-body" id="chat-body">
      <div class="bot-msg">Yo, I’m Boogie. Ask me anything. 🍃</div>
    </div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Ask Boogie..." />
      <button id="send-btn">Send</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
